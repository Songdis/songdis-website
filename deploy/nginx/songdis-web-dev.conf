# dev.songdis.com — the artist site on dev.
#
# Beside the production vhost, forwarding to the dev container on 127.0.0.1:3001. It points
# at the staging API, so it is a complete second copy of the site rather than a preview.

# ─────────────────────────────────────────────────────────────────────────────
# Real client IPs, from behind Cloudflare.
#
# With the orange cloud on, every request reaches this box from a Cloudflare address. Without
# this block nginx and then Laravel see ONE client for the entire internet, and anything
# counting per person collapses: the private-link comment throttle (12/min), the passcode
# unlock throttle (10/min), the hashed commenter identity and the listener token behind likes
# and ratings. One person commenting would rate-limit everybody.
#
# Ranges from https://www.cloudflare.com/ips/ — worth refreshing when Cloudflare publishes
# changes, which is rare.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dev.songdis.com;

    # Certbot's HTTP-01 challenge, if TLS is ever issued that way. Everything else goes to
    # HTTPS. (With a Cloudflare Origin Certificate this path is unused but harmless.)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://dev.songdis.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.songdis.com;

    ssl_certificate     /etc/letsencrypt/live/dev.songdis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.songdis.com/privkey.pem;

    # Artwork and audio are large; the default 1m rejects an upload before it starts.
    client_max_body_size 100M;

    # A slow phone on Nigerian mobile data should not have its upload cut off mid-way.
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    access_log /var/log/nginx/songdis-web-dev.access.log;
    error_log  /var/log/nginx/songdis-web-dev.error.log;

    # Next fingerprints these filenames, so they can be cached hard and forever. Served
    # straight from the proxy cache headers rather than asking the app each time.
    # A full copy of the site on a public hostname is exactly the sort of thing that ends up
    # in search results competing with the real one.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme would read "http" here, since Cloudflare and nginx have already terminated
        # TLS — telling the app the request was insecure and breaking any absolute URL it builds.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Server-sent events and streamed responses — the Ayo chat streams its reply, and
        # buffering here would hold the whole answer back and undo it.
        proxy_buffering off;
        proxy_set_header Connection "";
    }
}
