# dev.songdis.com — the artist site on dev.
#
# Beside the production vhost, forwarding to the dev container on 127.0.0.1:3001. It points
# at the staging API, so it is a complete second copy of the site rather than a preview.

# Cloudflare real-IP handling lives in conf.d/cloudflare-realip.conf, shared by every
# vhost on this host — it is http-level and cannot be declared twice.

# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dev.songdis.com;

    # Certbot's HTTP-01 challenge, if TLS is ever issued that way. Everything else goes to
    # HTTPS. (With a Cloudflare Origin Certificate this path is unused but harmless.)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://dev.songdis.com$request_uri;
    }
}

server {
    # http2 as a listen parameter: this server runs nginx 1.24, where the standalone
    # `http2 on;` directive of 1.25+ is an unknown-directive error.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.songdis.com;

    ssl_certificate     /etc/letsencrypt/live/dev.songdis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.songdis.com/privkey.pem;

    # Artwork and audio are large; the default 1m rejects an upload before it starts.
    client_max_body_size 100M;

    # A slow phone on Nigerian mobile data should not have its upload cut off mid-way.
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    access_log /var/log/nginx/songdis-web-dev.access.log;
    error_log  /var/log/nginx/songdis-web-dev.error.log;

    # Next fingerprints these filenames, so they can be cached hard and forever. Served
    # straight from the proxy cache headers rather than asking the app each time.
    # A full copy of the site on a public hostname is exactly the sort of thing that ends up
    # in search results competing with the real one.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme would read "http" here, since Cloudflare and nginx have already terminated
        # TLS — telling the app the request was insecure and breaking any absolute URL it builds.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Server-sent events and streamed responses — the Ayo chat streams its reply, and
        # buffering here would hold the whole answer back and undo it.
        proxy_buffering off;
        proxy_set_header Connection "";
    }
}
