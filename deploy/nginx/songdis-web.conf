# songdis.com — the artist site.
#
# Lives on the host alongside the API's vhosts (prod.songdis.com, test.songdis.com) and
# forwards to the container on 127.0.0.1:3000. Copy to /etc/nginx/sites-available/ and link
# into sites-enabled/.

# Cloudflare real-IP handling lives in conf.d/cloudflare-realip.conf, shared by every
# vhost on this host — it is http-level and cannot be declared twice.

# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name songdis.com www.songdis.com;

    # Certbot's HTTP-01 challenge, if TLS is ever issued that way. Everything else goes to
    # HTTPS. (With a Cloudflare Origin Certificate this path is unused but harmless.)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://songdis.com$request_uri;
    }
}

# www → apex, so the site has one address rather than two that both work.
server {
    # http2 as a listen parameter: this server runs nginx 1.24, where the standalone
    # `http2 on;` directive of 1.25+ is an unknown-directive error.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.songdis.com;

    ssl_certificate     /etc/letsencrypt/live/songdis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/songdis.com/privkey.pem;

    return 301 https://songdis.com$request_uri;
}

server {
    # http2 as a listen parameter: this server runs nginx 1.24, where the standalone
    # `http2 on;` directive of 1.25+ is an unknown-directive error.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name songdis.com;

    ssl_certificate     /etc/letsencrypt/live/songdis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/songdis.com/privkey.pem;

    # Artwork and audio are large; the default 1m rejects an upload before it starts.
    client_max_body_size 100M;

    # A slow phone on Nigerian mobile data should not have its upload cut off mid-way.
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    access_log /var/log/nginx/songdis-web.access.log;
    error_log  /var/log/nginx/songdis-web.error.log;

    # Next fingerprints these filenames, so they can be cached hard and forever. Served
    # straight from the proxy cache headers rather than asking the app each time.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme would read "http" here, since Cloudflare and nginx have already terminated
        # TLS — telling the app the request was insecure and breaking any absolute URL it builds.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Server-sent events and streamed responses — the Ayo chat streams its reply, and
        # buffering here would hold the whole answer back and undo it.
        proxy_buffering off;
        proxy_set_header Connection "";
    }
}
