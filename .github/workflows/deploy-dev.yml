name: Deploy site to Dev

on:
  push:
    branches:
      - develop

# One deploy at a time, and never cancelled halfway. A build killed between `docker compose
# build` and `up` leaves the old container running against a half-built image.
concurrency:
  group: web-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to dev server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The build happens on the server and takes a couple of minutes on six cores.
          command_timeout: 20m
          script: |
            set -e
            cd /opt/songdis-web-dev

            echo "Current image, in case this needs rolling back..."
            BEFORE=$(docker compose -f docker-compose.dev.yml images -q web 2>/dev/null || echo "none")
            echo "Before: $BEFORE"

            echo "Pulling develop..."
            git fetch origin
            git reset --hard origin/develop

            # Built through buildx, not `docker compose build`.
            #
            # This host uses Docker's containerd image store, which fails to export a layer
            # containing react-icons - tens of thousands of tiny files - with
            # "lstat ... no such file or directory" AFTER a completely successful compile.
            # The docker-container builder builds in isolation and only loads the finished
            # image, which sidesteps that export entirely.
            #
            # The args are read from .env and passed explicitly: NEXT_PUBLIC_* is compiled
            # INTO the bundle, so building with the wrong file points the site at the wrong
            # API and no runtime setting can correct it.
            echo "Building..."
            set -a
            . ./.env
            set +a
            docker buildx build --builder songdis --load \
              --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              --build-arg NEXT_PUBLIC_AYO_URL="$NEXT_PUBLIC_AYO_URL" \
              -t songdis-web:dev .

            echo "Starting..."
            docker compose --env-file .env -f docker-compose.dev.yml up -d --no-build

            echo "Waiting for it to answer..."
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3001/; then
                echo "Up after ${i}s"
                HEALTHY=1
                break
              fi
              sleep 1
            done

            if [ -z "$HEALTHY" ]; then
              echo "The new container never answered. Rolling back."
              docker compose --env-file .env -f docker-compose.dev.yml down
              if [ "$BEFORE" != "none" ] && [ -n "$BEFORE" ]; then
                docker tag "$BEFORE" songdis-web:dev
                docker compose --env-file .env -f docker-compose.dev.yml up -d
              fi
              exit 1
            fi

            # Only once the new one is serving. Images are a few hundred MB each and this box
            # also runs the API and two databases.
            docker image prune -f --filter "until=168h"

            echo "Deployed."
