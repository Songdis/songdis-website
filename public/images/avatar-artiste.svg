<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Default artist avatar">
  <!--
    Default artist avatar.

    Pure vector, so it stays sharp at every size it is used at — from the 28px
    sidebar chip up to the profile header. The figure is clipped to the disc so
    the shoulders meet the edge cleanly instead of spilling past it.
  -->
  <defs>
    <clipPath id="avatarDisc">
      <circle cx="32" cy="32" r="32" />
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="32" fill="#D9D9D9" />

  <g clip-path="url(#avatarDisc)" fill="#FFFFFF">
    <circle cx="32" cy="27.5" r="11.5" />
    <circle cx="32" cy="61" r="19.5" />
  </g>
</svg>
